<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 额度信号站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-text">AI 额度信号站</span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" type="button" data-product="codex">
          <span class="tab-status" id="status-codex"></span>
          ChatGPT / Codex
        </button>
        <button class="tab" type="button" data-product="claude">
          <span class="tab-status" id="status-claude"></span>
          Claude Code
        </button>
        <button class="tab" type="button" data-product="grok">
          <span class="tab-status" id="status-grok"></span>
          Grok
        </button>
      </nav>
      <div class="topbar-right">
        <span class="last-check" id="lastCheck"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card subscribe-card">
      <div class="card-row">
        <div class="subscribe-info">
          <h3>飞书推送</h3>
          <p>新的额度重置、额度卡，以及开放中的预告变更，会发给飞书群机器人。服务端 Webhook 仍在 Cloudflare Secret 或 local/config.json。</p>
        </div>
        <div class="subscribe-form">
          <input type="text" id="webhookInput" placeholder="粘贴飞书自定义机器人 Webhook URL" class="webhook-input">
          <button id="saveWebhook" class="btn-primary">保存</button>
        </div>
      </div>
      <div class="webhook-status" id="webhookStatus"></div>
    </div>

    <div id="panels"></div>
  </main>

  <template id="panel-template">
    <section class="panel">
      <div class="hero">
        <div class="hero-left">
          <h1 class="hero-title" data-role="title"></h1>
          <p class="hero-desc" data-role="desc"></p>
          <div class="hero-meta">
            <span class="meta-item">
              <span class="meta-label" title="stats.lastResetAt，重置和额度卡都计入">距上次</span>
              <span class="meta-value" data-role="time-since">—</span>
            </span>
            <span class="meta-item">
              <span class="meta-label" title="medianGapHours ÷ 24，不是平均间隔">间隔中位数</span>
              <span class="meta-value" data-role="gap-value">—</span>
            </span>
            <span class="meta-item">
              <span class="meta-label" title="历史间隔外推，不是个人额度倒计时，也不是官方日程">下次估计</span>
              <span class="meta-value" data-role="estimate-value">—</span>
              <span class="meta-sub" data-role="estimate-sub"></span>
            </span>
          </div>
          <p class="hero-disclaimer" data-role="disclaimer"></p>
        </div>
      </div>

      <div class="stats-grid" data-role="stats"></div>
      <div class="watch-card is-empty" data-role="watch"></div>

      <div class="section-header">
        <h2>重置时间线</h2>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot dot-confirmed"></span>已确认重置</span>
          <span class="legend-item"><span class="legend-dot dot-card"></span>额度卡</span>
        </div>
      </div>

      <div class="timeline-wrapper">
        <button class="timeline-nav nav-left" type="button" data-role="scroll-left" aria-label="向左滚动">‹</button>
        <div class="timeline-scroll" data-role="timeline-scroll">
          <div class="timeline" data-role="timeline"></div>
        </div>
        <button class="timeline-nav nav-right" type="button" data-role="scroll-right" aria-label="向右滚动">›</button>
      </div>

      <div class="section-header">
        <h2>事件详情</h2>
        <span class="event-count" data-role="event-count"></span>
      </div>
      <div class="event-list" data-role="event-list"></div>
    </section>
  </template>

  <footer class="footer">
    <p id="footerSource">数据来源 <a href="https://whenreset.dev/api/resets" target="_blank" rel="noopener">whenreset.dev/api/resets</a> · Codex / Claude / Grok 同源 · 估计不是官方日程 · 仅供参考</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
